services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: osip
      POSTGRES_USER: osip
      POSTGRES_PASSWORD: osip
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osip -d osip"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - osip-postgres:/var/lib/postgresql/data

volumes:
  osip-postgres:

